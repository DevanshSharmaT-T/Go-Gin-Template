# Live-reload configuration for `make dev` (https://github.com/air-verse/air).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  # Prepend GO_ENV so the app loads the .env.development tier.
  full_bin = "GO_ENV=development ./tmp/main"
  include_ext = ["go", "tmpl", "tpl", "html", "env"]
  # docs/ is excluded on purpose: `make swagger` rewrites it and would
  # otherwise trigger a rebuild loop.
  exclude_dir = ["bin", "tmp", "vendor", "docs", "uploads", "node_modules", "test/testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true
  log = "air.log"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
