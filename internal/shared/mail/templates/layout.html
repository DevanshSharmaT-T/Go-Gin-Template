{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;border:1px solid #e4e7eb;">
<tr><td style="padding:28px 32px 8px;">
<p style="margin:0;font-size:14px;font-weight:600;letter-spacing:.02em;color:#616e7c;">{{.AppName}}</p>
</td></tr>
<tr><td style="padding:0 32px 24px;">
{{template "content" .}}
</td></tr>
<tr><td style="padding:0 32px 28px;border-top:1px solid #f0f2f5;">
<p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#7b8794;">
If the button does not work, copy this link into your browser:<br>
<span style="word-break:break-all;color:#3e4c59;">{{.ActionURL}}</span>
</p>
<p style="margin:12px 0 0;font-size:12px;line-height:1.6;color:#9aa5b1;">
This is an automated message from {{.AppName}}; replies are not monitored.
</p>
</td></tr>
</table>
</body>
</html>{{end}}

{{define "button"}}<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr>
<td style="border-radius:6px;background:#2563eb;">
<a href="{{.ActionURL}}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">{{.ActionLabel}}</a>
</td></tr></table>{{end}}
